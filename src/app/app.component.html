<div class="container">
  <header>
    <h1>{{ title }}</h1>
    <div *ngIf="!loading" class="search-box">
      <input
        type="text"
        placeholder="Search by movie name or UPC..."
        [value]="searchQuery"
        (input)="onSearchChange($any($event).target.value)"
        class="search-input"
      />
    </div>
  </header>

  <main>
    <div *ngIf="loading" class="loading">
      <p>Loading movies...</p>
    </div>

    <div *ngIf="error" class="error">
      <p>{{ error }}</p>
      <button (click)="loadMovies()">Retry</button>
    </div>

    <div *ngIf="!loading && !error" class="movies-grid">
      <div *ngFor="let movie of movies" class="movie-card">
        <div class="movie-poster">
          <img
            *ngIf="movie.cover_art_url"
            [src]="movie.cover_art_url"
            [alt]="movie.name"
            class="poster-image"
          />
          <div *ngIf="!movie.cover_art_url" class="no-image">No Image</div>
        </div>
        <div class="movie-info">
          <h3 class="movie-name">{{ movie.name }}</h3>
          <p class="movie-data" *ngIf="movie.data">
            <strong>UPC:</strong> {{ movie.data }}
          </p>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && !error && movies.length === 0" class="no-movies">
      <p>{{ searchQuery ? 'No movies match your search.' : 'No movies found in the database.' }}</p>
    </div>
  </main>
</div>
