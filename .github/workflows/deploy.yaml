name: Build and Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main # Change to master if your default branch is master

permissions:
  contents: write # Required to push the build to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Use the Node version matching your Angular app
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Application
        # Replace 'your-repo-name' with your exact GitHub repository name
        run: npm run build -- --configuration=production --base-href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/movielookup # Change 'your-project-name' to your actual dist subfolder name
          branch: gh-pages # The branch the action will deploy to
